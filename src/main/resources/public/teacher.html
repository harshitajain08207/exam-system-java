<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f4f5fa;
            margin: 0;
            padding: 30px 20px;
        }
        .container { max-width: 640px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: white; font-weight: 600;
        }
        h2 { color: #1a1a2e; margin: 0; font-weight: 600; font-size: 20px; }
        .subtitle { color: #888; font-size: 12px; margin-top: 2px; }
        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .card h3 {
            margin: 0 0 18px;
            color: #1a1a2e;
            font-size: 16px;
            font-weight: 600;
        }
        input, textarea, select, button {
            width: 100%;
            padding: 12px 14px;
            margin: 6px 0;
            border-radius: 8px;
            border: 1.5px solid #e5e5e5;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #764ba2; }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            padding: 13px;
        }
        button:hover { opacity: 0.9; }
        .logout {
            background: white;
            color: #e53e3e;
            border: 1.5px solid #fed7d7;
            width: auto;
            padding: 9px 18px;
            font-size: 13px;
            margin: 0;
        }
        .logout:hover { background: #fff5f5; opacity: 1; }
        #examMsg, #questionMsg { text-align: center; margin-top: 10px; font-weight: 500; font-size: 13px; }
        .success { color: #38a169; }
        .error { color: #e53e3e; }
        .options-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        #questionSection { display: none; }
        .exam-id-badge {
            background: #f0e9ff;
            color: #764ba2;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 14px;
            font-weight: 500;
            font-size: 13px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 13px;
        }
        .result-row:last-child { border-bottom: none; }
        .result-name { font-weight: 500; color: #1a1a2e; }
        .result-score { color: #38a169; font-weight: 600; }
        .flag-badge {
            background: #fff5f5;
            color: #e53e3e;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            margin-left: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <div class="header-icon">T</div>
            <div>
                <h2>Teacher Dashboard</h2>
                <div class="subtitle" id="welcomeMsg"></div>
            </div>
        </div>
        <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="card">
        <h3>Create New Exam</h3>
        <input type="text" id="examTitle" placeholder="Exam Title (e.g. Java Basics Test)">
        <input type="number" id="examDuration" placeholder="Duration (minutes)">
        <button onclick="createExam()">Create Exam</button>
        <div id="examMsg"></div>
    </div>

    <div class="card" id="questionSection">
        <h3>Add Question</h3>
        <div class="exam-id-badge" id="currentExamBadge"></div>
        <textarea id="questionText" placeholder="Question text" rows="2"></textarea>
        <div class="options-row">
            <input type="text" id="optionA" placeholder="Option A">
            <input type="text" id="optionB" placeholder="Option B">
            <input type="text" id="optionC" placeholder="Option C">
            <input type="text" id="optionD" placeholder="Option D">
        </div>
        <select id="correctOption">
            <option value="A">Correct Answer: A</option>
            <option value="B">Correct Answer: B</option>
            <option value="C">Correct Answer: C</option>
            <option value="D">Correct Answer: D</option>
        </select>
        <button onclick="addQuestion()">Add Question</button>
        <div id="questionMsg"></div>
    </div>

    <div class="card">
        <h3>View Exam Results</h3>
        <input type="number" id="resultsExamId" placeholder="Enter Exam ID">
        <button onclick="loadResults()">Load Results</button>
        <div id="resultsContainer"></div>
    </div>
</div>

<script>
    let currentExamId = null;
    const teacherId = localStorage.getItem('userId');
    const role = localStorage.getItem('role');
    const name = localStorage.getItem('name');

    if (!teacherId || role !== 'TEACHER') {
        window.location.href = '/login.html';
    } else {
        document.getElementById('welcomeMsg').innerText = 'Welcome, ' + name;
    }

    function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }

    function createExam() {
        const title = document.getElementById('examTitle').value;
        const duration = document.getElementById('examDuration').value;
        const msg = document.getElementById('examMsg');

        if (!title || !duration) {
            msg.className = 'error';
            msg.innerText = 'Please fill in both fields.';
            return;
        }

        fetch('/api/createExam', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `title=${encodeURIComponent(title)}&duration=${duration}&teacherId=${teacherId}`
        })
        .then(res => res.text())
        .then(examId => {
            currentExamId = examId;
            msg.className = 'success';
            msg.innerText = 'Exam created! ID: ' + examId;
            document.getElementById('questionSection').style.display = 'block';
            document.getElementById('currentExamBadge').innerText = 'Adding questions to: ' + title + ' (Exam ID: ' + examId + ')';
        });
    }

    function addQuestion() {
        const questionText = document.getElementById('questionText').value;
        const optionA = document.getElementById('optionA').value;
        const optionB = document.getElementById('optionB').value;
        const optionC = document.getElementById('optionC').value;
        const optionD = document.getElementById('optionD').value;
        const correctOption = document.getElementById('correctOption').value;
        const msg = document.getElementById('questionMsg');

        if (!questionText || !optionA || !optionB || !optionC || !optionD) {
            msg.className = 'error';
            msg.innerText = 'Please fill in all fields.';
            return;
        }

        fetch('/api/addQuestion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `examId=${currentExamId}&questionText=${encodeURIComponent(questionText)}&optionA=${encodeURIComponent(optionA)}&optionB=${encodeURIComponent(optionB)}&optionC=${encodeURIComponent(optionC)}&optionD=${encodeURIComponent(optionD)}&correctOption=${correctOption}`
        })
        .then(res => res.text())
        .then(text => {
            msg.className = text.includes('added') ? 'success' : 'error';
            msg.innerText = text;
            if (text.includes('added')) {
                document.getElementById('questionText').value = '';
                document.getElementById('optionA').value = '';
                document.getElementById('optionB').value = '';
                document.getElementById('optionC').value = '';
                document.getElementById('optionD').value = '';
            }
        });
    }

    function loadResults() {
        const examId = document.getElementById('resultsExamId').value;
        if (!examId) return;

        fetch('/api/getResults/' + examId)
            .then(res => res.json())
            .then(results => {
                const container = document.getElementById('resultsContainer');
                if (results.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#888; font-size:13px;">No submissions yet for this exam.</p>';
                    return;
                }

                container.innerHTML = results.map(r => `
                    <div class="result-row">
                        <span class="result-name">${r.studentName}</span>
                        <span>
                            <span class="result-score">${r.score} pts</span>
                            ${r.tabSwitchCount > 0 ? `<span class="flag-badge">${r.tabSwitchCount} tab switch(es)</span>` : ''}
                        </span>
                    </div>
                `).join('');
            });
    }
</script>

</body>
</html>
