<!DOCTYPE html>
<html>
<head>
    <title>Secure Online Exam System - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: white;
            padding: 45px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 360px;
        }
        .brand {
            text-align: center;
            margin-bottom: 25px;
        }
        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            font-size: 26px;
        }
        h2 {
            text-align: center;
            color: #1a1a2e;
            margin: 0 0 4px;
            font-weight: 600;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }
        input, select, button {
            width: 100%;
            padding: 13px 14px;
            margin: 7px 0;
            border-radius: 8px;
            border: 1.5px solid #e5e5e5;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #764ba2;
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            margin-top: 12px;
            padding: 13px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .toggle {
            text-align: center;
            margin-top: 16px;
            color: #764ba2;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .toggle:hover { text-decoration: underline; }
        #message {
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            font-weight: 500;
        }
        .error { color: #e53e3e; }
        .success { color: #38a169; }
    </style>
</head>
<body>

<div class="box">
    <div class="brand">
        <div class="brand-icon">?</div>
        <h2 id="formTitle">Welcome Back</h2>
        <div class="subtitle" id="formSubtitle">Login to Secure Online Exam System</div>
    </div>

    <div id="signupFields" style="display:none;">
        <input type="text" id="name" placeholder="Full Name">
        <select id="role">
            <option value="STUDENT">I'm a Student</option>
            <option value="TEACHER">I'm a Teacher</option>
        </select>
    </div>

    <input type="email" id="email" placeholder="Email address">
    <input type="password" id="password" placeholder="Password">
    <button onclick="submitForm()">Login</button>

    <div class="toggle" onclick="toggleForm()">Don't have an account? Sign up</div>
    <div id="message"></div>
</div>

<script>
    let isSignup = false;

    function toggleForm() {
        isSignup = !isSignup;
        document.getElementById('formTitle').innerText = isSignup ? 'Create Account' : 'Welcome Back';
        document.getElementById('formSubtitle').innerText = isSignup ? 'Sign up to get started' : 'Login to Secure Online Exam System';
        document.getElementById('signupFields').style.display = isSignup ? 'block' : 'none';
        document.querySelector('button').innerText = isSignup ? 'Sign Up' : 'Login';
        document.querySelector('.toggle').innerText = isSignup ? 'Already have an account? Login' : "Don't have an account? Sign up";
        document.getElementById('message').innerText = '';
    }

    function submitForm() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const msg = document.getElementById('message');

        if (isSignup) {
            const name = document.getElementById('name').value;
            const role = document.getElementById('role').value;

            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&role=${role}`
            })
            .then(res => res.text())
            .then(text => {
                if (text.includes('successful')) {
                    msg.className = 'success';
                    msg.innerText = text + ' Please login now.';
                    toggleForm();
                } else {
                    msg.className = 'error';
                    msg.innerText = text;
                }
            });
        } else {
            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
            })
            .then(res => res.text())
            .then(text => {
                if (text.startsWith('SUCCESS:')) {
                    const parts = text.split(':');
                    localStorage.setItem('userId', parts[1]);
                    localStorage.setItem('role', parts[2]);
                    localStorage.setItem('name', parts[3]);

                    msg.className = 'success';
                    msg.innerText = 'Login successful! Redirecting...';

                    setTimeout(() => {
                        window.location.href = parts[2] === 'TEACHER' ? '/teacher.html' : '/student.html';
                    }, 700);
                } else {
                    msg.className = 'error';
                    msg.innerText = 'Login failed. Check your email and password.';
                }
            });
        }
    }
</script>

</body>
</html>
